name: Release

on:
  release:
    types: [prereleased, released]

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          ./gradlew patchChangelog --release-note="$CHANGELOG"

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*.zip --clobber

      - name: Bump Version and Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Strip the leading 'v' (e.g. v2.1.0 -> 2.1.0)
          CURRENT="${VERSION#v}"

          # Compute next patch version (e.g. 2.1.0 -> 2.1.1)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"

          BRANCH="release-post-$CURRENT"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -b "$BRANCH"

          # Update pluginVersion in gradle.properties
          sed -i "s/^pluginVersion=.*/pluginVersion=$NEXT/" gradle.properties

          # Stage both changelog and version bump
          git add CHANGELOG.md gradle.properties
          git commit -m "Release $CURRENT: patch CHANGELOG and bump version to $NEXT"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --title "Post-release: bump version to $NEXT" \
            --body "After releasing \`$CURRENT\`:\n- Patched \`CHANGELOG.md\` with release notes\n- Bumped \`pluginVersion\` to \`$NEXT\` for the next development cycle" \
            --base master \
            --head "$BRANCH"
