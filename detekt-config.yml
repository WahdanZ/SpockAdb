# Default detekt configuration:
# https://github.com/detekt/detekt/blob/master/detekt-core/src/main/resources/default-detekt-config.yml

formatting:
  Indentation:
    active: false

complexity:
  LongParameterList:
    # Test fixture builders legitimately mirror the shape of the data class under test.
    excludes: ['**/test/**']
  TooManyFunctions:
    # Swing panels decompose into many small private methods, which is the readable shape
    # for UI code — collapsing them into fewer, larger ones would be worse.
    thresholdInClasses: 20

style:
  ReturnCount:
    # Guard clauses read better than the nesting required to satisfy a single-return rule,
    # and the tool implementations are mostly precondition checks.
    max: 4
    excludeGuardClauses: true
