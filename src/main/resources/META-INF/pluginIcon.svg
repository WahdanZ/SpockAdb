  <circle cx="9.5" cy="6.5" r="2" fill="white"/>
  <line x1="26" y1="13" x2="30" y2="7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30.5" cy="6.5" r="2" fill="white"/>

