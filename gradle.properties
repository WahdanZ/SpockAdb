kotlin.code.style=official

pluginGroup=com.wahdan
pluginName=SpockAdb
pluginVersion=3.0.0

# Compile against the latest stable Android Studio (Meerkat) so all current APIs are available.
# sinceBuild=231 means Hedgehog (2023.1.1) and every release after it is supported.
# untilBuild is left empty so new releases are accepted without a plugin update.
pluginSinceBuild=231
pluginUntilBuild=

# Target Android Studio version used for compilation
androidStudioVersion=2025.1.1.14

platformDownloadSources=true

# Gradle
gradleVersion=8.13

# Java
javaVersion=17

# Suppress default kotlin stdlib dependency (we use bundled one)
kotlin.stdlib.default.dependency=false

# Configuration cache (disabled until first successful build)
org.gradle.configuration-cache=false
