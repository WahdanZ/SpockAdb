kotlin.code.style=official

pluginGroup=com.wahdan
pluginName=SpockAdb
pluginVersion=3.0.0

# Android Studio Panda 1 (2025.3.1) - canary used for build compatibility
# Use 253 as since, leave untilBuild empty to allow future versions
pluginSinceBuild=253.28294.334
pluginUntilBuild=

# Target Android Studio version (Panda 1 canary - has zip download support)
androidStudioVersion=2025.3.1.1

platformDownloadSources=true

# Gradle
gradleVersion=8.13

# Java
javaVersion=17

# Suppress default kotlin stdlib dependency (we use bundled one)
kotlin.stdlib.default.dependency=false

# Configuration cache (disabled until first successful build)
org.gradle.configuration-cache=false
