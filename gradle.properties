kotlin.code.style=official

pluginGroup=com.wahdan
pluginName=SpockAdb
pluginVersion=2.1.0

# Android Studio Panda 1 (2025.3.1) - stable release
# Use 253 as since, leave untilBuild empty to allow future versions
pluginSinceBuild=253
pluginUntilBuild=

# Target Android Studio version (Panda 1 2025.3.1.7)
androidStudioVersion=2025.3.1.7

platformDownloadSources=true

# Gradle
gradleVersion=8.10.2

# Java
javaVersion=17

# Suppress default kotlin stdlib dependency (we use bundled one)
kotlin.stdlib.default.dependency=false

# Configuration cache (disabled until first successful build)
org.gradle.configuration-cache=false
