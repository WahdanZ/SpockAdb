org.gradle.java.home=/Users/ahmedwahdan/Library/Java/JavaVirtualMachines/jbrsdk_jcef-17.0.14/Contents/Home

# Suppress default kotlin stdlib dependency (we use bundled one)
kotlin.stdlib.default.dependency=false

# Configuration cache (disabled until first successful build)
org.gradle.configuration-cache=false
