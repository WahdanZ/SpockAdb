kotlin.code.style=official

pluginGroup=com.wahdan
pluginName=SpockAdb
pluginVersion=4.0.3

# Supported range: Android Studio 2023.2 (Iguana) and IntelliJ IDEA 2023.2, and later.
#
# The floor was 231 until the Marketplace verifier reported IntelliJ IDEA 2023.1.7 as Critical:
# the Android plugin bundled with IDEA 2023.1 has no `com.android.tools.idea.execution`, which
# `Restart App With Debugger` links against. That finding was suppressed locally in
# verifier-ignored-problems.txt, so CI stayed green while the Marketplace did not — 2023.1 is
# the only build where the package is missing, so raising the floor removes the problem at its
# source rather than hiding it.
#
# sinceBuild is verified, not assumed: `./gradlew verifyPlugin` checks the plugin against
# Android Studio 232/242/251 and IntelliJ IDEA 232/251 on every CI run. Lowering this value
# without extending that matrix has previously shipped a plugin that could not open its own
# tool window on older builds. See docs/COMPATIBILITY.md before changing it.
#
# untilBuild is left empty so new releases are accepted without a plugin update.
pluginSinceBuild=232
pluginUntilBuild=

# Target Android Studio version used for compilation
androidStudioVersion=2025.1.1.14

platformDownloadSources=true

# Gradle
gradleVersion=8.13

# Java
javaVersion=17

# Suppress default kotlin stdlib dependency (we use bundled one)
kotlin.stdlib.default.dependency=false

# Configuration cache (disabled until first successful build)
org.gradle.configuration-cache=false

# Build memory.
#
# Gradle's defaults are 512 MiB heap and 384 MiB metaspace, and this project outgrew them: CI
# failed the Plugin Verifier job with "Gradle build daemon has been stopped: since the JVM
# garbage collector is thrashing" during compileJava, before verification even started, and the
# Kotlin daemon failed locally with "Not enough memory to run compilation".
#
# The Kotlin compile daemon is a separate process and does not inherit org.gradle.jvmargs, so it
# is sized on its own line. Both are well inside a 7 GiB GitHub runner with the Plugin Verifier
# forking its own JVM on top.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2g
